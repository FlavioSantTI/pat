<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect width="512" height="512" rx="128" fill="url(#luminaGrad)" />

  <!-- Center subtle glow badge -->
  <circle cx="256" cy="256" r="160" fill="#FFFFFF" fill-opacity="0.08" />

  <!-- Lumina Emblem: Lotus & Compassion Rays -->
  <g transform="translate(156, 156)" fill="none" stroke="#FFFFFF" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
    <!-- Heart / Lotus base -->
    <path d="M100 180 C 40 130, 20 80, 60 40 C 90 10, 100 40, 100 70 C 100 40, 110 10, 140 40 C 180 80, 160 130, 100 180 Z" fill="#FFFFFF" fill-opacity="0.9" />
    <!-- Gentle outer supportive petals -->
    <path d="M45 120 C 10 90, 15 45, 50 45" stroke="#FFFFFF" stroke-opacity="0.75" />
    <path d="M155 120 C 190 90, 185 45, 150 45" stroke="#FFFFFF" stroke-opacity="0.75" />
    <!-- Core seed of clarity -->
    <circle cx="100" cy="100" r="12" fill="#4F46E5" />
  </g>
</svg>
